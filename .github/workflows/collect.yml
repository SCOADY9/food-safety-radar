name: Collect food safety signals

on:
  schedule:
    - cron: "17 * * * *"   # every hour
  workflow_dispatch:        # "Run workflow" button in GitHub

concurrency:
  group: collect          # never run two collections at once; queue instead
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  collect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run collector
        run: python collector/collect.py
      - name: Commit new data
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add site/data/alerts.json collector/state/seen_links.json
          git diff --cached --quiet || git commit -m "Update signals $(date -u +%FT%H:%MZ)"
          git pull --rebase -X theirs origin main || true
          git push
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
